<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>正在连接客服...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0f;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }
    .loader {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(212, 168, 83, 0.15);
      border-top-color: #d4a853;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 30px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 22px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    h1 strong {
      color: #d4a853;
      font-weight: 600;
    }
    p {
      color: #6b7280;
      font-size: 14px;
      margin-top: 12px;
    }
    .manual-link {
      margin-top: 30px;
      padding: 16px 24px;
      border: 1px solid rgba(212, 168, 83, 0.15);
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .manual-link p {
      margin-top: 0;
      font-size: 13px;
      color: #9ca3af;
    }
    .manual-link a {
      display: inline-block;
      margin-top: 8px;
      color: #d4a853;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      word-break: break-all;
    }
    .manual-link a:hover {
      color: #e8c97a;
    }
  </style>
</head>
<body>

  <div class="loader"></div>
  <h1>正在连接 <strong>客服</strong>...</h1>
  <p>请稍候，即将为您转接</p>

  <div class="manual-link">
    <p>如果未自动跳转，请点击下方链接：</p>
    <a href="#" id="manualLink">正在获取号码...</a>
  </div>

  <script>
    // ============================================================
    // 👇 在这里填写你的 WhatsApp 客服号码（只填数字，不含 + 号）
    // ============================================================
    const numbers = [
      "886982200282",   // 客服1
      "886912345678",   // 客服2  ← 替换成你的
      "886987654321",   // 客服3  ← 替换成你的
      // 想加几个就加几个，逗号隔开
    ];

    // ============================================================
    // 随机选择一个号码
    // ============================================================
    function getRandomNumber() {
      const index = Math.floor(Math.random() * numbers.length);
      return numbers[index];
    }

    // ============================================================
    // 执行跳转
    // ============================================================
    const selected = getRandomNumber();
    const waUrl = "https://wa.me/" + selected;

    // 更新手动跳转链接
    const manualLink = document.getElementById('manualLink');
    manualLink.href = waUrl;
    manualLink.textContent = waUrl;

    // 自动跳转（延迟 1.2 秒，让页面先渲染出来）
    setTimeout(function() {
      window.location.href = waUrl;
    }, 1200);
  </script>
</body>
</html>
